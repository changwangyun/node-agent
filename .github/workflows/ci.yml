name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: Test & Vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -v -count=1 -cover -timeout 60s

      - name: Build check
        run: CGO_ENABLED=0 go build -ldflags="-s -w" -o node-agent .
