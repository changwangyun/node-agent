name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.goos }}-${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: linux
            goarch: arm
            goarm: 7
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
            ext: .exe

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm || '' }}
          CGO_ENABLED: 0
        run: |
          VERSION=${GITHUB_REF_NAME:-dev}
          BINARY=node-agent
          if [ -n "${{ matrix.ext }}" ]; then
            BINARY="${BINARY}${{ matrix.ext }}"
          fi
          go build -ldflags="-s -w -X main.Version=${VERSION}" -o ${BINARY} .

      - name: Package
        run: |
          BINARY=node-agent
          if [ -n "${{ matrix.ext }}" ]; then
            BINARY="${BINARY}${{ matrix.ext }}"
          fi
          ARCH_SUFFIX="${{ matrix.goos }}-${{ matrix.goarch }}"
          if [ -n "${{ matrix.goarm }}" ]; then
            ARCH_SUFFIX="${{ matrix.goos }}-armv${{ matrix.goarm }}"
          fi

          mkdir -p package
          cp ${BINARY} package/
          cp deploy/install.sh package/
          cp deploy/node-agent.service package/

          cd package
          tar czf ../node-agent-${ARCH_SUFFIX}.tar.gz *
          cd ..

          echo "ARCH_SUFFIX=${ARCH_SUFFIX}" >> $GITHUB_ENV
          sha256sum node-agent-${ARCH_SUFFIX}.tar.gz > node-agent-${ARCH_SUFFIX}.tar.gz.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: node-agent-${{ env.ARCH_SUFFIX }}
          path: |
            node-agent-*.tar.gz
            node-agent-*.sha256
          retention-days: 1

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -lh artifacts/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/*.tar.gz
            artifacts/*.sha256
          body: |
            ## Node Agent VPN 节点代理

            ### 快速安装

            ```bash
            bash <(curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/deploy/install.sh)
            ```

            ### 手动安装

            1. 下载对应架构的压缩包
            2. 解压: `tar xzf node-agent-linux-amd64.tar.gz`
            3. 安装: `bash install.sh --local`

            ### 架构选择

            | 文件 | 架构 |
            |------|------|
            | `node-agent-linux-amd64.tar.gz` | x86_64 (大多数 VPS) |
            | `node-agent-linux-arm64.tar.gz` | ARM64 (Oracle Cloud, AWS Graviton) |
            | `node-agent-linux-armv7.tar.gz` | ARMv7 (树莓派等) |
            | `node-agent-darwin-amd64.tar.gz` | macOS Intel |
            | `node-agent-darwin-arm64.tar.gz` | macOS Apple Silicon |
            | `node-agent-windows-amd64.tar.gz` | Windows x86_64 |
